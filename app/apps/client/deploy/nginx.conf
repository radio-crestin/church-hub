# The public web app (dist-public) as static files: non-root, read-only root
# filesystem (pid and temp files in /tmp, an emptyDir in the pod), SPA
# fallback, PWA cache headers and the security headers (security-headers.conf,
# written at build time with the hashes of index.html's inline scripts).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout combined;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 1k;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # add_header in a location replaces the server's, so every location
    # includes the security headers itself.
    location = /healthz {
      access_log off;
      default_type text/plain;
      include /etc/nginx/security-headers.conf;
      return 200 "ok\n";
    }

    # Hashed build output never changes under its name.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # The service worker, its helpers, the manifest and the page: always
    # revalidated, so a new release reaches every installed app.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|[^/]+\.webmanifest)$ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
