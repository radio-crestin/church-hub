<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="HandheldFriendly" content="true" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#0070dd" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)" />
    <title>Church Hub</title>
    <script>
      // Projection and monitor-badge windows are pure black from the first
      // frame: the audience sees no flash and no app loading page.
      window.__blackWindow = /^\/(screen|monitor-badge)\//.test(window.location.pathname);
      if (window.__blackWindow) {
        document.documentElement.style.backgroundColor = '#000000';
        document.body && (document.body.style.backgroundColor = '#000000');
      } else {
        // Set theme immediately to avoid flash (only for non-screen routes)
        const theme = localStorage.getItem('church-hub-theme') || 'dark';
        document.documentElement.classList.add(theme);
      }
    </script>
  </head>
  <body>
        <script>
      // Capture HTML load time (before any modules)
      window.__htmlLoadTime = performance.now();
      window.__htmlLoadTimestamp = Date.now();
    </script>
    <div id="loading-screen" aria-busy="true">
      <!-- A calm, static skeleton of the page that is opening (DESIGN.md: no
           spinners or pulses competing for the eye), with the start-up status
           in a small card over it. -->
      <div id="loading-shell" aria-hidden="true">
        <div class="ls-sidebar">
          <div class="ls-brand">
            <svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#0070dd"/><path d="M11.4 7.4C9.9 6.3 7.9 5.8 5.4 5.9v9.9c2.4-.1 4.4.4 6 1.4z" fill="white"/><path d="M12.6 7.4c1.5-1.1 3.5-1.6 6-1.5v9.9c-2.4-.1-4.4.4-6 1.4z" fill="white"/><path d="M3.9 8.2v9.3c3.1-.3 5.9.3 8.1 1.7 2.2-1.4 5-2 8.1-1.7V8.2" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="ls-bar" style="width: 88px"></span>
          </div>
          <div class="ls-group"><span class="ls-bar ls-title"></span><span class="ls-row"></span></div>
          <div class="ls-group"><span class="ls-bar ls-title"></span><span class="ls-row"></span><span class="ls-row"></span><span class="ls-row"></span><span class="ls-row"></span><span class="ls-row"></span></div>
          <div class="ls-group"><span class="ls-bar ls-title"></span><span class="ls-row"></span><span class="ls-row"></span><span class="ls-row"></span></div>
        </div>
        <div class="ls-main">
          <div class="ls-header"><span class="ls-bar" style="width: 140px; height: 14px"></span></div>
          <div class="ls-columns">
            <div class="ls-panel ls-list"><span class="ls-field"></span><span class="ls-line"></span><span class="ls-line"></span><span class="ls-line"></span><span class="ls-line"></span><span class="ls-line"></span><span class="ls-line"></span></div>
            <div class="ls-panel ls-preview"><span class="ls-slide"></span><span class="ls-controls"><span class="ls-btn"></span><span class="ls-btn"></span></span></div>
            <div class="ls-panel ls-side"><span class="ls-field"></span><span class="ls-line"></span><span class="ls-line"></span><span class="ls-line"></span></div>
          </div>
        </div>
      </div>

      <div id="loading-content">
        <div class="ls-card-head">
          <div id="loading-spinner"></div>
          <div id="loading-message" role="status" aria-live="polite">Starting up</div>
        </div>
        <div id="loading-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" style="display: none;">
          <div class="ls-track"><div id="loading-progress-bar"></div></div>
          <div id="loading-progress-label"></div>
        </div>
        <ol id="loading-steps" style="display: none;"></ol>
        <div id="loading-hint"></div>
      </div>

      <style>
        #loading-screen {
          --ls-app: #f1f1f1; --ls-panel: #ffffff; --ls-line: #e3e3e3; --ls-sk: #ececec;
          --ls-fg: #111111; --ls-hint: #5e5e5e; --ls-shadow: 0 12px 32px rgba(0,0,0,0.12);
          position: fixed; inset: 0; z-index: 9999; display: flex; background: var(--ls-app);
          font-family: "Inter Variable", Inter, system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing: antialiased; color: var(--ls-fg);
        }
        .dark #loading-screen {
          --ls-app: #111111; --ls-panel: #161616; --ls-line: #262626; --ls-sk: #222222;
          --ls-fg: #ffffff; --ls-hint: #999999; --ls-shadow: 0 12px 32px rgba(0,0,0,0.55);
        }
        #loading-shell { flex: 1; display: flex; min-width: 0; }
        .ls-sidebar { width: 248px; flex: none; background: var(--ls-panel); border-right: 1px solid var(--ls-line); display: flex; flex-direction: column; }
        .ls-brand { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--ls-line); }
        .ls-group { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--ls-line); }
        .ls-bar { display: block; height: 10px; border-radius: 5px; background: var(--ls-sk); }
        .ls-title { width: 64px; }
        .ls-row { display: block; height: 16px; border-radius: 6px; background: var(--ls-sk); width: 78%; }
        .ls-row:nth-child(odd) { width: 64%; }
        .ls-main { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 16px 16px; }
        .ls-header { height: 56px; display: flex; align-items: center; }
        .ls-columns { flex: 1; display: flex; gap: 12px; min-height: 0; }
        .ls-panel { background: var(--ls-panel); border: 1px solid var(--ls-line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .ls-list { flex: 1.2; }
        .ls-preview { flex: 1.4; justify-content: center; align-items: center; }
        .ls-side { flex: 0 0 300px; }
        .ls-field { display: block; height: 34px; border-radius: 10px; background: var(--ls-sk); }
        .ls-line { display: block; height: 14px; border-radius: 6px; background: var(--ls-sk); width: 86%; }
        .ls-line:nth-child(3n) { width: 62%; }
        .ls-slide { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; background: #000000; }
        .ls-controls { display: flex; gap: 8px; }
        .ls-btn { display: block; width: 104px; height: 36px; border-radius: 8px; background: var(--ls-sk); }
        /* One skeleton per kind of page, chosen from the address being opened. */
        #loading-screen[data-layout="stage"] .ls-list, #loading-screen[data-layout="stage"] .ls-side { display: none; }
        #loading-screen[data-layout="settings"] .ls-list { flex: 0 0 240px; }
        #loading-screen[data-layout="settings"] .ls-preview, #loading-screen[data-layout="single"] .ls-preview,
        #loading-screen[data-layout="single"] .ls-side { display: none; }
        #loading-screen[data-layout="settings"] .ls-side { flex: 1; }
        @media (max-width: 1023px) { .ls-sidebar, .ls-side, .ls-preview { display: none !important; } .ls-list { display: flex !important; } }

        #loading-content {
          position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%);
          width: 340px; max-width: calc(100% - 32px); box-sizing: border-box;
          display: flex; flex-direction: column; gap: 12px; padding: 16px;
          background: var(--ls-panel); border: 1px solid var(--ls-line); border-radius: 12px;
          box-shadow: var(--ls-shadow); text-align: left;
        }
        .ls-card-head { display: flex; align-items: center; gap: 10px; }
        #loading-spinner { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid var(--ls-sk); border-top-color: #0070dd; animation: ls-spin 0.9s linear infinite; }
        #loading-message { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ls-fg); }
        .ls-track { height: 4px; border-radius: 2px; background: var(--ls-sk); overflow: hidden; }
        #loading-progress-bar { height: 100%; width: 0; background: #0070dd; transition: width 0.25s ease-out; }
        #loading-progress-label { margin-top: 6px; color: var(--ls-hint); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
        #loading-steps { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 24px; }
        #loading-steps li { display: flex; align-items: center; gap: 8px; color: var(--ls-hint); }
        #loading-steps li[data-state="active"] { color: var(--ls-fg); font-weight: 500; }
        .loading-step-mark { display: inline-flex; width: 16px; justify-content: center; color: #0070dd; }
        #loading-steps li[data-state="done"] .loading-step-mark { color: var(--ls-hint); }
        #loading-hint { margin: 0; color: var(--ls-hint); font-size: 13px; line-height: 18px; }
        #loading-hint:empty { display: none; }
        #loading-detail, #loading-reported { color: var(--ls-hint) !important; }
        #loading-retry:hover:not([disabled]) { background: #005cb8 !important; }
        @keyframes ls-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #loading-spinner { animation: none; } }
      </style>
    </div>
    <script>
      (function () {
        var screen = document.getElementById('loading-screen');
        if (!screen) return;
        // Projection and monitor-badge windows show only black: no skeleton, no card.
        if (window.__blackWindow) {
          screen.style.background = '#000000';
          document.getElementById('loading-shell').style.display = 'none';
          document.getElementById('loading-content').style.display = 'none';
          document.body.style.backgroundColor = '#000000';
          return;
        }
        var path = window.location.pathname;
        screen.dataset.layout = /^\/(songs|bible|schedules)(\/|$)/.test(path)
          ? 'workspace'
          : /^\/present(\/|$)/.test(path)
            ? 'stage'
            : /^\/settings(\/|$)/.test(path)
              ? 'settings'
              : 'single';
      })();
    </script>
    <div id="app"></div>
    <div id="portal"></div>
    <script>
      // Module load timing captured in router.tsx
    </script>
    <script type="module" src="/src/router.tsx"></script>
  </body>
</html>
