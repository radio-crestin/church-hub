<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="HandheldFriendly" content="true" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#6366f1" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Church Hub</title>
    <script>
      // For screen routes, set pure black background immediately to avoid any flash
      if (window.location.pathname.startsWith('/screen/')) {
        document.documentElement.style.backgroundColor = '#000000';
        document.body && (document.body.style.backgroundColor = '#000000');
      } else {
        // Set theme immediately to avoid flash (only for non-screen routes)
        const theme = localStorage.getItem('church-hub-theme') || 'dark';
        document.documentElement.classList.add(theme);
      }
    </script>
  </head>
  <body>
        <script>
      // Capture HTML load time (before any modules)
      window.__htmlLoadTime = performance.now();
      window.__htmlLoadTimestamp = Date.now();
    </script>
    <div id="loading-screen" style="
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      z-index: 9999;
      padding: 24px;
      text-align: center;
    ">
      <div id="loading-content" style="display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 380px;">
        <h1 style="margin: 0; font-size: 28px; font-weight: 600;">Church Hub</h1>
        <div id="loading-spinner" style="
          width: 28px;
          height: 28px;
          border: 2px solid rgba(79, 70, 229, 0.25);
          border-top-color: #6366f1;
          border-radius: 50%;
          animation: spin 0.9s linear infinite;
        "></div>
        <div id="loading-message" role="status" aria-live="polite" style="margin: 0; color: #f3f4f6; font-size: 15px; font-weight: 500;">Starting up</div>
        <div id="loading-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" style="display: none; width: 280px; max-width: 100%;">
          <div style="height: 6px; border-radius: 3px; background: rgba(99, 102, 241, 0.2); overflow: hidden;">
            <div id="loading-progress-bar" style="height: 100%; width: 0; background: #6366f1; transition: width 0.25s ease-out;"></div>
          </div>
          <div id="loading-progress-label" style="margin-top: 6px; color: #9ca3af; font-size: 12px; font-variant-numeric: tabular-nums;"></div>
        </div>
        <ol id="loading-steps" style="display: none; margin: 0; padding: 0; list-style: none; text-align: left; font-size: 13px; line-height: 1.9;"></ol>
        <div id="loading-hint" style="margin: 0; color: #9ca3af; font-size: 13px; line-height: 1.5;"></div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        #loading-steps li { display: flex; align-items: center; gap: 8px; color: #6b7280; }
        #loading-steps li[data-state="active"] { color: #f3f4f6; font-weight: 500; }
        #loading-steps li[data-state="done"] { color: #9ca3af; }
        .loading-step-mark { display: inline-flex; width: 16px; justify-content: center; color: #6366f1; }
        #loading-steps li[data-state="done"] .loading-step-mark { color: #22c55e; }
        #loading-retry:hover:not([disabled]) {
          background: #4338ca !important;
        }
      </style>
    </div>
    <script>
      // For screen routes, show only pure black background - no loading content
      if (window.location.pathname.startsWith('/screen/')) {
        var loadingContent = document.getElementById('loading-content');
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingContent) loadingContent.style.display = 'none';
        if (loadingScreen) loadingScreen.style.background = '#000000';
        // Also ensure body is black
        document.body.style.backgroundColor = '#000000';
      }
    </script>
    <div id="app"></div>
    <div id="portal"></div>
    <script>
      // Module load timing captured in router.tsx
    </script>
    <script type="module" src="/src/router.tsx"></script>
  </body>
</html>
