[package]
name = "church-hub"
version = "0.1.40"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "church_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset", "unstable", "devtools"] }
tauri-plugin-opener = "2.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.3"
parking_lot = "0.12.5"
tauri-plugin-http = { version = "2.5.4", features = ["unsafe-headers", "cookies"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-websocket = "2"
tauri-plugin-keep-screen-on = "0.1.2"
tauri-plugin-screen-brightness = { path = "../tauri-plugins/tauri-plugin-screen-brightness" }
tauri-plugin-process = "2"
# Used by the update check (asset selection), the feedback report and the
# sidebar user agent. Declared as a JS dependency long before this, but never
# registered here — so every os_type()/arch() call threw.
tauri-plugin-os = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Desktop only: the sidecar, projector windows, screen sharing, the audio
# player, global shortcuts and updates. The phone apps (Android, iOS) are the
# client alone, connected to a computer, and these crates don't build there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.0.2"
tokio = { version = "1.48.0", features = ["time"] }
tauri-plugin-global-shortcut = "2"
tauri-utils = "2"
url = "2"
ureq = "2"
tauri-plugin-single-instance = "2"
rodio = { version = "0.20", features = ["symphonia-all"] }
tauri-plugin-updater = "2"
# Native screen sharing (src/screen_capture/): xcap captures a screen or
# window on all three OSes, image scales and JPEG-encodes it, wgpu draws it on
# the projector windows (pollster blocks on its setup, bytemuck feeds its
# uniform), base64 carries the picker's thumbnails.
xcap = "0.9.10"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
wgpu = "30"
pollster = "1.0.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
base64 = "0.22"

# The phone apps scan the computer's pairing QR code (Settings > Phones).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[features]
# Local review builds only (app/scripts/review-build.ts, src/review.rs).
review-shell = []

# The review shell's own profile: keeps target/release for real builds, and
# incremental so a task that changes the shell rebuilds quickly.
[profile.review]
inherits = "release"
incremental = true
