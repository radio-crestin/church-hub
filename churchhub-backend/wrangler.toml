name = "churchhub-backend"
account_id = "c53124cf4d8c039271e3d52917a56b96"
main = "src/index.ts"
compatibility_date = "2024-12-01"
minify = true

# Enable observability for logs in Cloudflare dashboard
[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# Custom domain route
routes = [
  { pattern = "churchub-backend.radiocrestin.ro", custom_domain = true }
]

# KV namespace for WebRTC signaling relay
[[kv_namespaces]]
binding = "SIGNALING_KV"
id = "bc1b72f2df754e88a81e8e8c99ccee50"

# Non-sensitive environment variables
[vars]
YOUTUBE_SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl"
# Google Drive backup flow — same Google OAuth client as YouTube, different
# scopes (private per-app Drive folder + account identity). The redirect URI
# must be registered on the OAuth client in Google Cloud Console.
DRIVE_SCOPE = "openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/drive.appdata"
DRIVE_REDIRECT_URI = "https://churchub-backend.radiocrestin.ro/auth/drive/callback"
COOKIE_NAME = "yt_oauth_state"
COOKIE_MAX_AGE = 600

# Secrets must be set via wrangler secret put:
# - YOUTUBE_CLIENT_ID     (shared by the YouTube AND Drive flows)
# - YOUTUBE_CLIENT_SECRET (shared by the YouTube AND Drive flows)
# - COOKIE_ENCRYPTION_KEY (generate: openssl rand -hex 32)
# - ALLOWED_ORIGINS (comma-separated list)
# - YOUTUBE_REDIRECT_URI
# - GITHUB_TOKEN (GitHub PAT with repo scope for creating issues)
