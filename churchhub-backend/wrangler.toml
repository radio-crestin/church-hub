name = "churchhub-backend"
account_id = "c53124cf4d8c039271e3d52917a56b96"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# postgres.js (cloud sync on Postgres) needs node:buffer and node:stream.
compatibility_flags = ["nodejs_compat"]
minify = true

# Custom domain route. MUST stay above any [section] header: TOML assigns
# top-level keys to the most recent table, so placing it after
# [observability.logs] silently nested it there (wrangler warned about it)
# and the route was not applied from config.
routes = [
  { pattern = "churchub-backend.radiocrestin.ro", custom_domain = true }
]

# Enable observability for logs in Cloudflare dashboard
[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# KV namespace for WebRTC signaling relay; also holds the per-IP (hashed)
# rolling 24h quota of POST /feature-requests.
[[kv_namespaces]]
binding = "SIGNALING_KV"
id = "bc1b72f2df754e88a81e8e8c99ccee50"

# "Request a feature" screenshots, embedded in the public GitHub issue through
# GET /feature-requests/screenshots/:id. Create once before the first deploy:
#   npx wrangler r2 bucket create church-hub-feature-requests
[[r2_buckets]]
binding = "FEATURE_REQUEST_SCREENSHOTS"
bucket_name = "church-hub-feature-requests"

# Abuse guard for POST /feature-requests: 3 requests per minute per IP.
[[ratelimits]]
name = "FEATURE_REQUEST_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

# Cloud sync central state (T-171, README "Cloud sync"): any one of a D1
# database, Postgres through Hyperdrive, or the SYNC_DATABASE_URL secret
# (postgres://…). Until one is set, /sync/* answers 503 not_configured and
# the rest deploys as is.
# D1: npx wrangler d1 create churchhub-sync, uncomment with its id, then
# npx wrangler d1 migrations apply SYNC_DB --remote
# [[d1_databases]]
# binding = "SYNC_DB"
# database_name = "churchhub-sync"
# database_id = "<id from wrangler d1 create>"
# migrations_dir = "migrations/sqlite"
# Postgres: npx wrangler hyperdrive create churchhub-sync
# --connection-string="postgres://…", uncomment with its id, then
# SYNC_DATABASE_URL=postgres://… npm run db:migrate:postgresql
# [[hyperdrive]]
# binding = "SYNC_HYPERDRIVE"
# id = "<id from wrangler hyperdrive create>"

# Non-sensitive environment variables
[vars]
YOUTUBE_SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl"
# Google Drive backup flow — same Google OAuth client as YouTube, different
# scopes (private per-app Drive folder + account identity). The redirect URI
# must be registered on the OAuth client in Google Cloud Console.
DRIVE_SCOPE = "openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/drive.appdata"
DRIVE_REDIRECT_URI = "https://churchub-backend.radiocrestin.ro/auth/drive/callback"
COOKIE_NAME = "yt_oauth_state"
COOKIE_MAX_AGE = 600

# Secrets, never [vars]: `npm run deploy:prod` uploads every .prod.vars value
# as a Worker secret (deploy.sh, --secrets-file). Plain `wrangler deploy`
# keeps them.
# - YOUTUBE_CLIENT_ID     (shared by the YouTube AND Drive flows)
# - YOUTUBE_CLIENT_SECRET (shared by the YouTube AND Drive flows)
# - COOKIE_ENCRYPTION_KEY (generate: openssl rand -hex 32)
# - ALLOWED_ORIGINS (comma-separated list)
# - YOUTUBE_REDIRECT_URI
# - GITHUB_TOKEN (fine-grained PAT, radio-crestin/church-hub only, Issues:
#   read and write only; it opens the feature-request issues)
# - WAHA_URL, WAHA_API_KEY, WAHA_CHAT_ID (+ optional WAHA_SESSION,
#   WAHA_ACCESS_CLIENT_ID, WAHA_ACCESS_CLIENT_SECRET) for the WhatsApp
#   notice of each feature request. Unset = WhatsApp is skipped.
# - Cloud sync: SYNC_TOKEN_SECRET, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID,
#   S3_SECRET_ACCESS_KEY, S3_PUBLIC_URL (+ optional S3_REGION,
#   SYNC_COMPACT_AFTER). Unset = /sync/* answers 503 not_configured.
