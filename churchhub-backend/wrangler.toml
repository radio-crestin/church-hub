name = "churchhub-backend"
account_id = "c53124cf4d8c039271e3d52917a56b96"
main = "src/index.ts"
compatibility_date = "2024-12-01"
minify = true

# Custom domain route. MUST stay above any [section] header: TOML assigns
# top-level keys to the most recent table, so placing it after
# [observability.logs] silently nested it there (wrangler warned about it)
# and the route was not applied from config.
routes = [
  { pattern = "churchub-backend.radiocrestin.ro", custom_domain = true }
]

# Enable observability for logs in Cloudflare dashboard
[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
# Off: an invocation log records each request's full URL, and the signaling
# routes carry room secrets in the path. The app's own request logger
# (src/middleware/requestLogger.ts) logs the route pattern of every request.
invocation_logs = false

# KV namespace for WebRTC signaling relay.
[[kv_namespaces]]
binding = "SIGNALING_KV"
id = "bc1b72f2df754e88a81e8e8c99ccee50"

# Abuse guard for POST /sync/churches (registering a church server): 3 per
# minute per IP. A church registers once, so this never limits real use.
[[ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 3
  period = 60

# Abuse guard for POST /sync/library/submissions (a song sent to the curated
# Church Hub Library): 5 per minute per IP.
[[ratelimits]]
name = "LIBRARY_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 5
  period = 60

# Church Hub Cloud backup (/backup): every request, 60 per minute per IP
# (hashed into the key by the binding) ...
[[ratelimits]]
name = "BACKUP_RATE_LIMITER"
namespace_id = "1010"

  [ratelimits.simple]
  limit = 60
  period = 60

# ... and every signed-in request, 30 per minute per account. Uploads per
# day are counted in the account's record (BACKUP_UPLOADS_PER_DAY).
[[ratelimits]]
name = "BACKUP_ACCOUNT_RATE_LIMITER"
namespace_id = "1011"

  [ratelimits.simple]
  limit = 30
  period = 60

# Cloud backup upkeep (src/backup/runBackupMaintenance.ts): every hour,
# abort multipart uploads left unfinished and expire backups past 30 days;
# daily at 03:43 UTC, also recompute every account from the bucket.
[triggers]
crons = ["17 * * * *", "43 3 * * *"]

# Non-sensitive environment variables
[vars]
YOUTUBE_SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl"
# Google Drive backup flow — same Google OAuth client as YouTube, different
# scopes (private per-app Drive folder + account identity). The redirect URI
# must be registered on the OAuth client in Google Cloud Console.
DRIVE_SCOPE = "openid https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/drive.appdata"
DRIVE_REDIRECT_URI = "https://churchub-backend.radiocrestin.ro/auth/drive/callback"
# Cloud sync owner sign-in (T-172), same Google client; register this URI on it.
OWNER_REDIRECT_URI = "https://churchub-backend.radiocrestin.ro/sync/owner/callback"
# Cloud backup sign-in, same Google client; register this URI on it too.
BACKUP_REDIRECT_URI = "https://churchub-backend.radiocrestin.ro/backup/callback"
COOKIE_NAME = "yt_oauth_state"
COOKIE_MAX_AGE = 600

# Secrets, never [vars]: `npm run deploy:prod` uploads every .prod.vars value
# as a Worker secret (deploy.sh, --secrets-file). Plain `wrangler deploy`
# keeps them.
# - YOUTUBE_CLIENT_ID     (shared by the YouTube AND Drive flows)
# - YOUTUBE_CLIENT_SECRET (shared by the YouTube AND Drive flows)
# - COOKIE_ENCRYPTION_KEY (generate: openssl rand -hex 32)
# - ALLOWED_ORIGINS (comma-separated list)
# - YOUTUBE_REDIRECT_URI
# - Cloud sync (no database: each church's state is an encrypted object in
#   the bucket): SYNC_SECRET, S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID,
#   S3_SECRET_ACCESS_KEY, S3_PUBLIC_URL (+ optional S3_REGION,
#   S3_STATE_BUCKET, SYNC_COMPACT_AFTER). Unset = /sync/* answers 503.
#   The curated Church Hub Library's curators: LIBRARY_CURATORS (Google
#   emails or subs, comma-separated). Unset = nobody curates.
#   LIBRARY_PUBLISH_TOKEN: the build that publishes the libraries Church
#   Hub manages (Resurse Creștine…) writes them with it (openssl rand -hex 32).
# - Cloud backup (free, Google sign-in; a PRIVATE bucket of its own, never
#   the public sync bucket): BACKUP_SECRET, BACKUP_KEY_SECRET (never rotate:
#   it derives every account key), BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
#   BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY (+ optional
#   BACKUP_S3_REGION, BACKUP_S3_PRESIGN_ENDPOINT, BACKUP_MAX_BYTES,
#   BACKUP_QUOTA_BYTES, BACKUP_RETENTION_DAYS, BACKUP_UPLOADS_PER_DAY).
#   Unset = /backup/* answers 503. The admin panel (src/admin) is never on
#   the Worker: only the Node runtime serves it, on ADMIN_PORT.
