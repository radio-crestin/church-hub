name: PR build
run-name: "PR build #${{ github.event.pull_request.number || inputs.pr }}"

# A pull request's installers, only when someone asks: reviews use the
# app built locally for the reviewer's own computer (review-build.ts), so
# no push builds anything here. Asked for, it builds the named platforms
# with build-desktop.yml (the release build) into the one shared
# prerelease `pr-builds`, named after the PR and commit, and a section of
# the PR description links them.
#
# Ask on the PR (write access needed), or by hand:
#   /build                       all three: macOS (Apple Silicon), Windows, Linux
#   /build macos windows         only those
#   gh workflow run pr-build.yml -f pr=<number> -f platforms=macos,windows
#
# Quiet by design: watchers get an email when a release is published and
# the PR author when someone comments, but never when a release gets new
# assets or a description is edited. So the shared release is published
# once (by hand: gh release create pr-builds --prerelease) and nothing here
# creates a release or a comment. The cross-compiled Intel Mac installer is
# left to releases.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to build
        required: true
      platforms:
        description: Comma-separated platforms (macos, windows, linux) or all
        default: all

# Every comment on any PR or issue starts a run, which stops at once unless
# it is a /build: such a run gets a group of its own, so it never cancels a
# build in progress. A newer /build of the same PR replaces the running one.
concurrency:
  group: >-
    pr-build-${{
      (github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/build'))
      && format('{0}', github.event.issue.number || inputs.pr) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    # The build runs the PR's code with a token that writes releases, so
    # only for a branch of this repository (never a fork), asked by someone
    # with write access. author_association skips strangers before a runner
    # starts (CONTRIBUTOR stays in: the payload shows a private org member
    # as CONTRIBUTOR); the API check below is the real gate. A dispatch
    # needs write access to run at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/build') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reacting to a PR comment needs pull-requests: write, not only issues.
      pull-requests: write
      issues: write
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
      suffix: ${{ steps.resolve.outputs.suffix }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Check the commenter has write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" \
            --jq .permission 2>/dev/null || echo none)
          case "$PERMISSION" in
            admin|maintain|write) echo "$COMMENTER has $PERMISSION access" ;;
            *) echo "::error::$COMMENTER (permission=$PERMISSION) asked for a build; only people with write access get one."
               exit 1 ;;
          esac

      # "/build", "/build all", "/build macos win" → a list such as macos,windows.
      - name: Pick the platforms
        id: platforms
        env:
          ASKED: ${{ github.event_name == 'issue_comment' && github.event.comment.body || inputs.platforms }}
          FROM_COMMENT: ${{ github.event_name == 'issue_comment' }}
        run: |
          set -euo pipefail
          WORDS=$(printf '%s\n' "$ASKED" | head -n 1 | tr ',' ' ' | tr '[:upper:]' '[:lower:]')
          if [ "$FROM_COMMENT" = true ]; then WORDS=${WORDS#/build}; fi
          PICKED=()
          for WORD in $WORDS; do
            case "$WORD" in
              all) PICKED+=(macos windows linux) ;;
              macos|mac) PICKED+=(macos) ;;
              windows|win) PICKED+=(windows) ;;
              linux) PICKED+=(linux) ;;
              *) echo "::error::Unknown platform '$WORD': use macos, windows, linux or all."; exit 1 ;;
            esac
          done
          [ ${#PICKED[@]} -gt 0 ] || PICKED=(macos windows linux)
          LIST=$(printf '%s\n' "${PICKED[@]}" | awk '!seen[$0]++' | paste -sd, -)
          echo "platforms=$LIST" | tee -a "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        # A nicety: never fail the build over it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=rocket >/dev/null

      # The build carries the latest release's version, so the installed
      # test build's updater sees "up to date" instead of replacing itself
      # with the release.
      - name: Resolve the PR head, version and release
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.issue.number || inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::Not a PR number: $PR"; exit 1; }
          read -r SHA HEAD_REPO < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"\(.head.sha) \(.head.repo.full_name)"')
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$PR comes from $HEAD_REPO; only branches of this repository are built."
            exit 1
          fi
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          TAG="pr-builds"
          {
            echo "pr=$PR"
            echo "sha=$SHA"
            echo "suffix=pr-$PR-${SHA:0:7}"
            echo "tag=$TAG"
            echo "version=${LATEST#v}"
          } | tee -a "$GITHUB_OUTPUT"

          # A prerelease, not a draft: draft asset links 404 for anyone
          # without push access, and prereleases stay out of "Latest".
          # Never created here: publishing a release emails every watcher.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            echo "::error::The shared prerelease $TAG is missing. Publish it once: gh release create $TAG --prerelease --title 'PR test builds' --notes 'Installers of open pull requests, named church-hub-<platform>-pr-<number>-<commit>.'"
            exit 1
          }

  build:
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      artifact_suffix: ${{ needs.prepare.outputs.suffix }}
      release_tag: ${{ needs.prepare.outputs.tag }}
      macos_intel: false
      platforms: ${{ needs.prepare.outputs.platforms }}

  comment:
    needs: [prepare, build]
    # Not on cancel: the newer push's run writes the comment instead.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Link the installers on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.prepare.outputs.pr }}
          SHA: ${{ needs.prepare.outputs.sha }}
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { PR, SHA, SUFFIX, TAG, VERSION, PLATFORMS, RUN_URL } = process.env
            const repo = context.repo
            const START = '<!-- pr-build:start -->'
            const END = '<!-- pr-build:end -->'
            const LEGACY_MARKER = '<!-- pr-build -->'
            const asked = PLATFORMS.split(',')
            const platforms = [
              { name: 'macos', base: 'church-hub-macos-arm64', ext: 'dmg', label: 'macOS (Apple Silicon)' },
              { name: 'windows', base: 'church-hub-windows-x64', ext: 'exe', label: 'Windows (x64)' },
              { name: 'linux', base: 'church-hub-linux-x64', ext: 'AppImage', label: 'Linux (x64, AppImage)' },
            ].filter((p) => asked.includes(p.name))

            const release = await github.rest.repos.getReleaseByTag({ ...repo, tag: TAG })
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.data.id, per_page: 100,
            })

            const rows = platforms.map((p) => {
              const name = `${p.base}-${SUFFIX}.${p.ext}`
              const asset = assets.find((a) => a.name === name)
              const link = asset ? `[${name}](${asset.browser_download_url})` : `build failed — [log](${RUN_URL})`
              return { ...p, asset, row: `| ${p.label} | ${link} |` }
            })

            // This PR's older installers of a platform that rebuilt fine.
            for (const p of rows.filter((r) => r.asset)) {
              const stale = assets.filter((a) => a.name.startsWith(`${p.base}-pr-${PR}-`) && a.name !== p.asset.name)
              for (const a of stale) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: a.id })
              }
            }

            const section = [
              START,
              `### Test build of ${SHA.slice(0, 7)}`,
              '',
              '| Platform | Download |',
              '|---|---|',
              ...rows.map((r) => r.row),
              '',
              `Built from ${SHA} as version ${VERSION} · [build log](${RUN_URL}) · built on request: comment \`/build\` (or e.g. \`/build macos\`) for a newer push.`,
              'It installs over Church Hub on that computer and uses the same data: back it up first if this PR changes the database.',
              '',
              '<details><summary>Opening the unsigned installers</summary>',
              '',
              '- **macOS**: open the .dmg and drag church-hub into Applications. If macOS says it is damaged or can\'t be opened, run `xattr -c /Applications/church-hub.app` in Terminal once.',
              '- **Windows**: if SmartScreen shows "Windows protected your PC", click **More info** → **Run anyway**.',
              '- **Linux**: `chmod +x church-hub-linux-x64-*.AppImage`, then run it.',
              '',
              '</details>',
              END,
            ].join('\n')

            // In the description, not a comment: a new comment emails the
            // PR author, an edited description emails no one.
            const pull = await github.rest.pulls.get({ ...repo, pull_number: Number(PR) })
            const description = pull.data.body ?? ''
            // Markers that start a line: the text above may quote them inline.
            const at = description.lastIndexOf(`\n${START}`)
            const begin = at < 0 ? -1 : at + 1
            const end = begin < 0 ? -1 : description.indexOf(`\n${END}`, begin) + 1
            const body = begin >= 0 && end > begin
              ? description.slice(0, begin) + section + description.slice(end + END.length)
              : `${description.trimEnd()}\n\n${section}\n`
            await github.rest.pulls.update({ ...repo, pull_number: Number(PR), body })

            // The comment older builds left, now stale; deleting mails no one.
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number: Number(PR), per_page: 100,
            })
            for (const old of comments.filter((c) => c.body?.startsWith(LEGACY_MARKER))) {
              await github.rest.issues.deleteComment({ ...repo, comment_id: old.id })
            }
            core.summary.addRaw(section).write()
