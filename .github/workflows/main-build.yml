name: Main build

# Builds main for all four targets, the Intel Mac included, uploading
# nothing: proves main still builds and that its compiled sidecar answers
# /ping, and refreshes the shared caches. By hand only: GitHub Actions run
# before a release (build-release.yml, which also saves the caches), not on
# every push.
#   gh workflow run main-build.yml --ref main

on:
  workflow_dispatch:

# One at a time; a newer run replaces the waiting one, never the running one
# (a cancelled run would save no cache).
concurrency:
  group: main-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # build-desktop.yml's build job asks for contents: write (the release
    # upload, skipped here); a caller granting less fails at startup.
    permissions:
      contents: write
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      version: 0.0.0-main
      artifact_suffix: main-${{ github.sha }}
