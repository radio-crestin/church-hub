name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default; the jobs that write the release or push to main
# ask for contents: write themselves. The test job, which installs and
# runs the whole dependency tree, never holds a write token.
permissions:
  contents: read

# The updater signing key and the release deploy key live in the `release`
# environment, which only v* tags may use. Only the jobs that need them
# (create-release, the desktop builds, sync-version-back) name it.
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTUP_MAX_RETRIES: 10
  # Public PostHog tokens — write-only client-side keys, safe to embed in
  # the bundle. Secrets override the defaults so a fork can point to its
  # own PostHog project without editing the workflow. These MUST be in
  # the env at build time: Vite inlines VITE_PUBLIC_* into the client
  # bundle, and the Tauri/Rust build reads them so the shell can ship
  # startup events from the bundled binary.
  VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN || 'phc_x4iC8SNTkLtxooGYmbz6v3nFjYE2v6wXaNgZVHNaxatK' }}
  VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
  VITE_PUBLIC_POSTHOG_CONVERSATIONS_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_CONVERSATIONS_TOKEN || '4GDD07pVU98dgX9qHiFHNswimJuq7gD1hE6nvTHXMBY' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libpulse-dev \
            libasound2-dev \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Run unit tests
        working-directory: app
        run: bun run test:unit

      - name: Run server integration tests
        working-directory: app
        run: bun run test:server

      # WebKit runs the preview/projection specs (the macOS desktop app's
      # engine). The browser set is part of the key: a cache saved with
      # Chromium alone would otherwise be an exact hit and skip installing it.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('app/apps/client/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app/apps/client
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Build client
        working-directory: app
        run: bun run --filter client build

      - name: Run E2E tests
        working-directory: app/apps/client
        run: xvfb-run --auto-servernum -- npx playwright test --grep-invert "@obs"
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: app/apps/client/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: app/apps/client/test-results/
          retention-days: 7

  # Who may push a v* tag is decided by the tag rule set. A re-run, though,
  # can be started by anyone with write access, so every job that writes the
  # release or pushes to main runs only when the person re-running it is the
  # one who pushed the tag (github.actor stays the original pusher on a re-run).
  create-release:
    needs: [test]
    if: github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # Every update is verified against the public key compiled into the
      # app (plugins.updater.pubkey in tauri.conf.json), so a release built
      # without the matching private key is one no installed copy would ever
      # accept. Better to stop here than to publish it.
      - name: Check the updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Add the updater private key (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) to the release environment's secrets."
            exit 1
          fi

      # Upsert the GitHub release. Previously this called `gh release
      # create` unconditionally, which failed (exit 1) when a draft for
      # the tag already existed — the typical shape when the operator
      # tags a release through the GitHub UI's "Draft a new release"
      # flow. The workflow would then halt before `build` ever ran. Now
      # we check `gh release view` first and either edit the existing
      # release's title/notes or create a fresh draft.
      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract this version's auto-generated section from the committed
          # CHANGELOG.md (produced by scripts/release.sh before the tag). The
          # awk grabs everything between this version's "## vX.Y.Z" heading and
          # the next version heading. Falls back to a generic line if the tag
          # wasn't cut via release.sh (e.g. a manual UI tag).
          awk -v ver="## v$VERSION" '
            $0 ~ "^"ver"( |$)" { capture=1; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/changelog-section.md 2>/dev/null || true
          if [ ! -s /tmp/changelog-section.md ]; then
            echo "_See the commit history for details._" > /tmp/changelog-section.md
          fi

          # Build the release notes once into a temp file so the create and
          # edit branches share the same body. The changelog section is cat'd
          # in as a literal file (never shell-expanded) so commit messages
          # containing backticks or $ can't break the heredoc.
          {
          cat <<EOF
          # Church Hub $TAG

          A modern, feature-rich church presentation and livestream management system.

          ---

          ## What's Changed

          EOF
          cat /tmp/changelog-section.md
          cat <<EOF

          ---

          ## Direct Downloads

          | Platform | Download |
          |----------|----------|
          | **macOS** (Apple Silicon) | [Download .dmg](https://github.com/radio-crestin/church-hub/releases/download/$TAG/church-hub-macos-arm64-v-$VERSION.dmg) |
          | **macOS** (Intel) | [Download .dmg](https://github.com/radio-crestin/church-hub/releases/download/$TAG/church-hub-macos-x64-v-$VERSION.dmg) |
          | **Windows** (x64) | [Download .exe](https://github.com/radio-crestin/church-hub/releases/download/$TAG/church-hub-windows-x64-v-$VERSION.exe) |

          ---

          ## Quick Start

          1. Click the download link for your platform above
          2. Run the installer
          3. Launch Church Hub
          4. Access the web interface at \`http://localhost:3000\`

          ---

          ## macOS Installation Note

          After installing, if you see **"church-hub.app is damaged and can't be opened"**, run this command in Terminal:

          \`\`\`bash
          xattr -c /Applications/church-hub.app
          \`\`\`

          This removes the quarantine flag from unsigned apps.

          ---

          ## Documentation

          - [README](https://github.com/radio-crestin/church-hub#readme)
          - [API Documentation](http://localhost:3000/api/docs) (after installation)

          ---

          <sub>Made with love for churches everywhere</sub>
          EOF
          } > /tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its title and notes."
            # `gh release edit` preserves the existing draft/published
            # state, so a release the operator manually published from
            # the UI stays published; one left as draft stays a draft.
            gh release edit "$TAG" \
              --title "Church Hub $TAG" \
              --notes-file /tmp/release-notes.md
          else
            echo "Creating new draft release $TAG."
            gh release create "$TAG" \
              --draft \
              --title "Church Hub $TAG" \
              --notes-file /tmp/release-notes.md
          fi

  # The installers — built by the same workflow that builds every PR's
  # test build, so the release path is exercised on each pull request.
  build:
    needs: [test, create-release]
    if: github.triggering_actor == github.actor
    permissions:
      contents: write
    uses: ./.github/workflows/build-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.create-release.outputs.version }}
      artifact_suffix: v-${{ needs.create-release.outputs.version }}
      release_tag: v${{ needs.create-release.outputs.version }}
      tauri_release_tag: v__VERSION__

  # The updater manifest, then the release itself. Installed apps fetch
  # `releases/latest/download/latest.json` and pick the entry for their
  # platform: the download URL of the signed artifact plus its minisign
  # signature. Written once, after all three builds, from the assets already
  # on the release — and only then is the draft published, so `latest` never
  # points at a release whose manifest or installers are still missing.
  updater-manifest:
    needs: [build]
    if: github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          mkdir -p sigs
          gh release download "$TAG" --repo "$REPO" --dir sigs --pattern '*.sig'
          ls -la sigs

          # The signed asset for a platform, found by its tail rather than
          # spelled out: tauri-action names the macOS updater archives
          # `church-hub_aarch64.app.tar.gz` today and is moving to
          # `church-hub_<version>_aarch64.app.tar.gz`; either way the
          # signature file sits next to it under the same name plus `.sig`.
          asset_for() {
            local match
            match=$(ls sigs | grep -E "$1" | head -1)
            if [ -z "$match" ]; then
              echo "::error::No signature matching $1 on release $TAG (have: $(ls sigs | tr '\n' ' '))"
              exit 1
            fi
            echo "${match%.sig}"
          }
          MAC_ARM=$(asset_for '_aarch64\.app\.tar\.gz\.sig$')
          MAC_X64=$(asset_for '_x64\.app\.tar\.gz\.sig$')
          WIN=$(asset_for '_x64-setup\.exe\.sig$')
          BASE="https://github.com/$REPO/releases/download/$TAG"

          # Release notes: the same body the app already shows for a version.
          gh release view "$TAG" --repo "$REPO" --json body -q .body > notes.md

          jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_arm_url "$BASE/$MAC_ARM" \
            --arg mac_arm_sig "$(cat "sigs/$MAC_ARM.sig")" \
            --arg mac_x64_url "$BASE/$MAC_X64" \
            --arg mac_x64_sig "$(cat "sigs/$MAC_X64.sig")" \
            --arg win_url "$BASE/$WIN" \
            --arg win_sig "$(cat "sigs/$WIN.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $mac_arm_url, signature: $mac_arm_sig },
                "darwin-x86_64": { url: $mac_x64_url, signature: $mac_x64_sig },
                "windows-x86_64": { url: $win_url, signature: $win_sig }
              }
            }' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for name in "church-hub-macos-arm64-v-${TAG#v}.dmg" "church-hub-macos-x64-v-${TAG#v}.dmg" "church-hub-windows-x64-v-${TAG#v}.exe" latest.json; do
            if ! gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -qx "$name"; then
              echo "::error::Release $TAG is missing $name; leaving it as a draft."
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          echo "Published $TAG"

  # Keep `main` in lock-step with whatever was just released. Without this,
  # `app/tauri/tauri.conf.json` on `main` drifts behind the tag (the build job
  # only patches the version inside the CI checkout, never commits it back), so
  # local/dev builds report an old version and the in-app "you're up to date"
  # check is wrong. Runs for every release — whether the tag was cut via
  # scripts/release.sh (then this is a no-op) or straight from the GitHub UI.
  #
  # main's rule set requires pull requests and status checks; GitHub can't
  # list the Actions token as a bypass, so the push goes over SSH with the
  # RELEASE_DEPLOY_KEY deploy key (a release environment secret), which the
  # rule set lets through.
  sync-version-back:
    needs: [build, updater-manifest]
    if: github.triggering_actor == github.actor
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json

      - name: Sync version and changelog into main
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAURI_VERSION=$VERSION

          # Never move main backwards. This job runs at the very end of a build,
          # so a release cut while an earlier one was still building would
          # otherwise have the older run overwrite the newer version — which is
          # exactly what happened when v0.1.88 finished after v0.1.89 was
          # tagged, leaving main claiming 0.1.88 and the next `release.sh patch`
          # about to collide with an existing tag.
          CURRENT=$(grep -m1 '"version"' app/tauri/tauri.conf.json \
            | sed -E 's/.*: *"([^"]+)".*/\1/')
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$TAURI_VERSION" | sort -V | tail -1)
          if [ "$CURRENT" != "$TAURI_VERSION" ] && [ "$NEWEST" = "$CURRENT" ]; then
            echo "main is at $CURRENT, newer than $TAURI_VERSION — refusing to downgrade."
            exit 0
          fi

          echo "Syncing main to version $TAURI_VERSION"

          # tauri.conf.json is the single source of truth for the displayed
          # version (Tauri's getVersion() + Vite's __appVersion both read it).
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$TAURI_VERSION\"/" \
            app/tauri/tauri.conf.json

          # Regenerate the changelog so the bundled, offline release notes on
          # main include the version that was just released.
          bun app/scripts/generate-changelog.ts

      - name: Commit and push if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "main already in sync — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/tauri/tauri.conf.json \
            CHANGELOG.md \
            app/apps/client/src/features/release-notes/changelog.generated.json
          # [skip ci] so the push to main doesn't retrigger the test workflow.
          git commit -m "chore: sync version to v${GITHUB_REF#refs/tags/v} [skip ci]"
          git push origin main
