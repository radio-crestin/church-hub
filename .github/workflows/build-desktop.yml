name: Build desktop app

# The one place the desktop installers are built. Called by:
#   - build-release.yml — every v*.*.* tag (the published release)
#   - pr-build.yml      — every pull request (a test build to download)
#   - main-build.yml    — every push to main (keeps the shared caches warm)
#   - by hand (Actions → Run workflow), e.g. to try the release upload on a
#     throwaway draft release
# Each platform compiles the sidecar, smoke-tests it (/ping must answer),
# builds the Tauri bundle and uploads the installer, renamed to
# church-hub-<platform>-<artifact_suffix>.<ext>, to the GitHub release
# `release_tag` (which the caller creates first; empty uploads nothing).
#
# Caches, shared by every workflow and ref: Rust (rust-cache, one key per
# target), bun's download cache (same key as test.yml), Tauri's bundler
# tools. Only main saves Rust: PRs and release tags restore main's copy, so
# PR caches never evict it from the 10 GB budget.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. Empty builds the ref that triggered the caller.
        type: string
        default: ''
      version:
        description: Version written into tauri.conf.json, e.g. 0.1.103.
        type: string
        required: true
      artifact_suffix:
        description: Installer name tail, e.g. v-0.1.103 or pr-79-abc1234.
        type: string
        required: true
      release_tag:
        description: Existing GitHub release that receives the renamed installers. Empty uploads nothing.
        type: string
        default: ''
      tauri_release_tag:
        description: >-
          Passed to tauri-action as tagName, which then also uploads the raw
          bundles and updater signatures there. Empty skips that upload.
        type: string
        default: ''
      macos_intel:
        description: Also build the cross-compiled macOS x64 installer.
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to build (empty = the selected branch)
        default: ''
      version:
        description: Version written into tauri.conf.json, e.g. 0.1.103
        required: true
      artifact_suffix:
        description: Installer name tail
        required: true
      release_tag:
        description: Existing release for the renamed installers (empty = none)
        default: ''
      tauri_release_tag:
        description: Draft release for tauri-action's raw bundles (empty = none)
        default: ''
      macos_intel:
        description: Also build the macOS x64 installer
        type: boolean
        default: true

permissions:
  contents: read

env:
  # The shell crate is rebuilt on every run (rust-cache keeps only its
  # dependencies), and crate-local ThinLTO was 2/3 of that: ~165 s of the
  # macOS and ~205 s of the Windows Tauri step. Off, the crate builds about
  # twice as fast; a thin UI shell (the work happens in the Bun sidecar)
  # gains nothing measurable from it.
  CARGO_PROFILE_RELEASE_LTO: 'off'
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTUP_MAX_RETRIES: 10
  # Public PostHog tokens — write-only client-side keys, safe to embed in
  # the bundle. Secrets override the defaults so a fork can point to its
  # own PostHog project without editing the workflow. These MUST be in
  # the env at build time: Vite inlines VITE_PUBLIC_* into the client
  # bundle, and the Tauri/Rust build reads them so the shell can ship
  # startup events from the bundled binary.
  VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN || 'phc_x4iC8SNTkLtxooGYmbz6v3nFjYE2v6wXaNgZVHNaxatK' }}
  VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
  VITE_PUBLIC_POSTHOG_CONVERSATIONS_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_CONVERSATIONS_TOKEN || '4GDD07pVU98dgX9qHiFHNswimJuq7gD1hE6nvTHXMBY' }}

jobs:
  # The platforms to build. A job of its own because a matrix `exclude`
  # can't drop a platform described by an `include` entry: GitHub applies
  # `include` after `exclude` and adds the platform straight back.
  plan:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - name: Pick the platforms
        id: plan
        env:
          MACOS_INTEL: ${{ inputs.macos_intel }}
          # smoke: launch the compiled sidecar first. Not on the Intel Mac
          #   build, cross-compiled on an ARM runner that can't run it.
          # optional: Linux is new and not in the updater manifest yet, so a
          #   failed Linux build must not hold back the macOS/Windows release.
          # Linux ships an AppImage (one file for most distros), built on
          #   22.04 to run on older glibc; tauri.conf.json only lists macOS
          #   and Windows bundles, hence --bundles.
          PLATFORMS: |
            [
              { "target": "macos-arm64", "platform": "macos-latest",
                "rust_target": "aarch64-apple-darwin", "bun_target": "bun-darwin-arm64",
                "sidecar_suffix": "aarch64-apple-darwin",
                "artifact_base": "church-hub-macos-arm64", "artifact_ext": "dmg",
                "tauri_args": "", "smoke": true, "optional": false },
              { "target": "macos-x64", "platform": "macos-latest",
                "rust_target": "x86_64-apple-darwin", "bun_target": "bun-darwin-x64",
                "sidecar_suffix": "x86_64-apple-darwin",
                "artifact_base": "church-hub-macos-x64", "artifact_ext": "dmg",
                "tauri_args": "", "smoke": false, "optional": false },
              { "target": "windows-x64", "platform": "windows-latest",
                "rust_target": "x86_64-pc-windows-msvc", "bun_target": "bun-windows-x64",
                "sidecar_suffix": "x86_64-pc-windows-msvc.exe",
                "artifact_base": "church-hub-windows-x64", "artifact_ext": "exe",
                "tauri_args": "", "smoke": true, "optional": false },
              { "target": "linux-x64", "platform": "ubuntu-22.04",
                "rust_target": "x86_64-unknown-linux-gnu", "bun_target": "bun-linux-x64",
                "sidecar_suffix": "x86_64-unknown-linux-gnu",
                "artifact_base": "church-hub-linux-x64", "artifact_ext": "AppImage",
                "tauri_args": "--bundles appimage", "smoke": true, "optional": true }
            ]
        run: |
          PICKED=$(jq -c --argjson intel "$MACOS_INTEL" \
            '[.[] | select($intel or .target != "macos-x64")]' <<<"$PLATFORMS")
          echo "platforms=$PICKED" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.artifact_base }})
    needs: plan
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}

    runs-on: ${{ matrix.platform }}
    # Uploads the installers to the release.
    permissions:
      contents: write
    env:
      # Caches are written only by main building its own commit. A PR build
      # started by hand also runs as main but checks out the PR's code,
      # which must never end up in a cache the release and every PR restore.
      SAVE_CACHES: ${{ github.ref == 'refs/heads/main' && inputs.ref == '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # The version is used as is, pre-release suffix included: the
      # updater compares versions as semver, so a build tagged 0.1.98-beta.1
      # must call itself that, or it would offer itself 0.1.98-beta.2 as an
      # older release. (The MSI, which only accepted numeric versions and used
      # to force the suffix off, is no longer built.)
      - name: Name the artifact
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARTIFACT_NAME: ${{ matrix.artifact_base }}-${{ inputs.artifact_suffix }}.${{ matrix.artifact_ext }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (artifact: $ARTIFACT_NAME)"

      - name: Update version in tauri.conf.json
        shell: bash
        env:
          TAURI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd app/tauri
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "(Get-Content tauri.conf.json) -replace '\"version\": \"[^\"]*\"', '\"version\": \"$TAURI_VERSION\"' | Set-Content tauri.conf.json"
          else
            sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$TAURI_VERSION\"/" tauri.conf.json
            rm -f tauri.conf.json.bak
          fi

      # Tauri's WebKitGTK shell, the tray/shortcut plugins, rodio's ALSA
      # output and the MIDI module's ALSA/JACK bindings.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json

      # Same path and key as test.yml, so all workflows share one entry. Only
      # bun's download cache: node_modules (230 MB on macOS, 40 s to restore)
      # links back out of it in seconds. Not on Windows: unpacking it there
      # took 63–69 s, longer than `bun install` downloading everything (~60 s).
      - name: Restore Bun dependencies
        if: runner.os != 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './app/tauri -> target'
          cache-targets: true
          cache-on-failure: true
          shared-key: ${{ matrix.rust_target }}
          save-if: ${{ env.SAVE_CACHES == 'true' }}

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      # The v0.1.60 lesson: a sidecar that passes `bun test` can still die
      # when compiled. Launch the compiled one, laid out like the bundle,
      # and require /ping-style readiness before spending time on Tauri.
      - name: Smoke-test the compiled sidecar
        if: matrix.smoke
        working-directory: app/apps/server
        env:
          RUN_COMPILE_TESTS: '1'
        timeout-minutes: 10
        shell: bash
        run: bun test src/__tests__/compiled-sidecar.test.ts

      # No separate client build: Tauri's beforeBuildCommand (build:apps)
      # always rebuilds the client and the native sidecar anyway. The sidecar
      # below is for the cross-compiled Intel Mac, which build:apps can't make.
      - name: Ensure sidecar bin directory exists
        shell: bash
        run: mkdir -p app/tauri/bin

      - name: Compile server sidecar
        working-directory: app/apps/server
        shell: bash
        run: |
          mkdir -p ../../tauri/bin
          OUTFILE="../../tauri/bin/church-hub-sidecar-${{ matrix.sidecar_suffix }}"
          echo "Compiling sidecar to: $OUTFILE"
          bun build \
            --compile \
            --production \
            --minify \
            --minify-syntax \
            --target ${{ matrix.bun_target }} \
            --outfile "$OUTFILE" \
            ./src/index.ts

      - name: Verify sidecar binary
        shell: bash
        run: |
          echo "Contents of tauri/bin:"
          ls -la app/tauri/bin/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f "app/tauri/bin/church-hub-sidecar-${{ matrix.sidecar_suffix }}" || exit 1
          else
            test -x "app/tauri/bin/church-hub-sidecar-${{ matrix.sidecar_suffix }}" || exit 1
          fi
          echo "Sidecar binary verified successfully"

      # linuxdeploy and its plugins, which the AppImage bundler downloads.
      - name: Restore Tauri bundler tools
        if: runner.os == 'Linux'
        id: tauri-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri
          key: ${{ runner.os }}-tauri-tools-v1

      - name: Build Tauri app
        id: tauri_build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: bunx tauri
          args: --target ${{ matrix.rust_target }} ${{ matrix.tauri_args }}
          tagName: ${{ inputs.tauri_release_tag }}
          releaseName: 'Church Hub v__VERSION__'
          releaseDraft: true
          prerelease: false
          # latest.json is assembled once all three builds are uploaded (see
          # the updater-manifest job); letting each matrix job write its own
          # copy would have them overwrite each other.
          uploadUpdaterJson: false

      - name: Debug - List all bundle outputs
        shell: bash
        run: |
          echo "=== Listing all bundle directories ==="
          find app/tauri/target -type d -name "bundle" 2>/dev/null | while read -r dir; do
            echo "Found bundle dir: $dir"
            find "$dir" -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.sig" \) 2>/dev/null
          done
          echo "=== Done ==="

      # The updater refuses anything unsigned, so a build that produced no
      # signature must not reach the release.
      - name: Verify the updater signature was produced
        shell: bash
        run: |
          SIG=$(find app/tauri/target -type f \( -name "*.app.tar.gz.sig" -o -name "*-setup.exe.sig" -o -name "*.AppImage.sig" \) 2>/dev/null | head -1)
          if [ -z "$SIG" ]; then
            echo "::error::No updater signature (.sig) was produced — is TAURI_SIGNING_PRIVATE_KEY set and does it match plugins.updater.pubkey?"
            exit 1
          fi
          echo "Signature: $SIG"

      # .dmg on macOS, the NSIS *-setup.exe on Windows, the .AppImage on Linux.
      - name: Create versioned artifact
        shell: bash
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          case "$RUNNER_OS" in
            macOS) PATTERN='*.dmg' ;;
            Windows) PATTERN='*-setup.exe' ;;
            Linux) PATTERN='*.AppImage' ;;
          esac
          FILE=$(find app/tauri/target -name "$PATTERN" -type f 2>/dev/null | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::No $PATTERN installer found under app/tauri/target"
            exit 1
          fi
          cp "$FILE" "$ARTIFACT_NAME"
          ls -la "$ARTIFACT_NAME"

      - name: Upload versioned artifact to release
        if: inputs.release_tag != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: gh release upload "$TAG" "$ARTIFACT_NAME" --clobber --repo "$GITHUB_REPOSITORY"

      # Saved last and only by trusted runs (SAVE_CACHES); an existing key
      # is never overwritten, so a hit skips the save.
      - name: Save Bun dependencies
        if: runner.os != 'Windows' && env.SAVE_CACHES == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Save Tauri bundler tools
        if: runner.os == 'Linux' && env.SAVE_CACHES == 'true' && steps.tauri-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri
          key: ${{ steps.tauri-tools-cache.outputs.cache-primary-key }}
