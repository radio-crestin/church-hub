name: Secret scan

# Fails when a secret reaches the repo. Runs on every push to any branch and on every PR:
#   1. gitleaks over all history, branches and tags (.gitleaks.toml)
#   2. gitleaks over the checked-out files
#   3. key-shape grep over tracked files, binaries too (gitleaks skips them)
#   4. fixture tests: settings allow-list, no secret fields in any fixture

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt
          gitleaks version

      - name: Scan all history
        run: gitleaks git --redact --verbose --no-banner --log-opts="--all" .

      - name: Scan checked-out files
        run: gitleaks dir --redact --verbose --no-banner .

      - name: Scan tracked files for key shapes (binaries too)
        run: sh scripts/check-key-shapes.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: app/package.json

      - name: Fixture secret tests
        working-directory: app/apps/server
        run: bun test src/db/fixtures
