name: Test

# The pre-release gate, on macOS, Windows and Linux:
#   - e2e: the Playwright suite (app/apps/client/e2e), the project's only tests,
#   - smoke: the COMPILED sidecar boots and serves the API (the v0.1.60
#     lesson: a sidecar that runs from source can die once compiled).
#
# Runs only before a release: build-release.yml calls it on every v* tag and
# publishes nothing unless it is green. Pull requests and pushes run no tests
# here: every task is accepted on the full e2e suite run locally. Run it by
# hand on main ahead of tagging to catch a platform failure early:
#   gh workflow run test.yml --ref main

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # Public PostHog tokens — write-only client-side keys, safe to embed in
  # the bundle. Forks override via repository secrets. These need to be in
  # the env when the client builds (Vite inlines VITE_PUBLIC_*) and when
  # the compiled sidecar runs (it initialises posthog-node on import).
  VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN || 'phc_x4iC8SNTkLtxooGYmbz6v3nFjYE2v6wXaNgZVHNaxatK' }}
  VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST || 'https://eu.i.posthog.com' }}
  VITE_PUBLIC_POSTHOG_CONVERSATIONS_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_CONVERSATIONS_TOKEN || '4GDD07pVU98dgX9qHiFHNswimJuq7gD1hE6nvTHXMBY' }}
  # One browser folder on every OS, so the cache path is the same.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/../ms-playwright
  # Caches are saved only by main or a v* tag testing its own commit (there
  # is no input to test another commit), never by a run of another branch:
  # a release restores them.
  TRUSTED_RUN: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux audio + MIDI deps and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libpulse-dev libasound2-dev libjack-jackd2-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json

      # Not on Windows: unpacking the cache there is slower than downloading.
      # Exact key only, and saved below only by trusted runs (TRUSTED_RUN).
      - name: Restore Bun dependencies
        if: runner.os != 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      # WebKit runs the preview/projection specs (the macOS desktop app's
      # engine). The browser set is part of the key.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('app/apps/client/package.json') }}

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Save Bun dependencies
        if: runner.os != 'Windows' && env.TRUSTED_RUN == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: app/apps/client
        run: npx playwright install --with-deps chromium webkit

      - name: Save Playwright browsers
        if: env.TRUSTED_RUN == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        working-directory: app/apps/client
        run: npx playwright install-deps chromium webkit

      - name: Build client
        working-directory: app
        run: bun run --filter client build

      - name: Run E2E tests (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: app/apps/client
        run: xvfb-run --auto-servernum -- npx playwright test --grep-invert "@obs"
        env:
          CI: true

      - name: Run E2E tests
        if: runner.os != 'Linux'
        working-directory: app/apps/client
        run: npx playwright test --grep-invert "@obs"
        env:
          CI: true

      - name: Upload Playwright report and traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            app/apps/client/playwright-report/
            app/apps/client/test-results/
          retention-days: 7
          if-no-files-found: ignore

  smoke:
    name: Release build smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux audio + MIDI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libasound2-dev libjack-jackd2-dev

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json

      # Exact key only, and saved below only by trusted runs (TRUSTED_RUN).
      - name: Restore Bun dependencies
        if: runner.os != 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Save Bun dependencies
        if: runner.os != 'Windows' && env.TRUSTED_RUN == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Smoke-test the compiled sidecar
        working-directory: app/apps/server
        timeout-minutes: 10
        run: bun run smoke:sidecar

  # The few unit tests kept on purpose: data-safety and security logic no
  # e2e spec can reach (sync merge needs Google Drive; the feature-request
  # worker's limits and escaping run on Cloudflare, not in the e2e server).
  kept-unit-tests:
    name: Kept unit tests (sync merge, request worker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: app/package.json

      - name: Sync merge
        working-directory: app/apps/server
        run: bun run test

      - name: Request-a-feature worker
        working-directory: churchhub-backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          bun test
